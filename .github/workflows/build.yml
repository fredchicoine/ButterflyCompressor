name: Build Butterfly Compressor

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release (e.g. v1.0.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Mac
            targets: ButterflyCompressor_VST3 ButterflyCompressor_AU ButterflyCompressor_Standalone
            extra:
          - os: windows-latest
            name: Windows
            targets: ButterflyCompressor_VST3 ButterflyCompressor_Standalone
            extra: ""
    runs-on: ${{ matrix.os }}
    env:
      BFLY_VERSION: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cmake --build build --config Release --target $t --parallel 4
          done
      - name: Make Mac installer
        if: matrix.name == 'Mac'
        run: BFLY_VERSION="${BFLY_VERSION#v}" installer/mac/build-pkg.sh
      - name: Make Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $env:BFLY_VERSION = $env:BFLY_VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ButterflyCompressor-${{ matrix.name }}-Installer
          path: installer-out/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: Butterfly Compressor ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          body: |
            **Download the installer for your system below.**
            - **Windows:** the `Windows-Setup.exe` installs the VST3 and the standalone app. If SmartScreen warns, click *More info → Run anyway*.
            - **Mac:** the `.pkg` installs VST3, AU and the standalone app on Apple Silicon and Intel Macs. If macOS blocks it, right-click the .pkg and choose *Open*.

            Rescan plugins in your DAW after installing.
          files: installer-out/*
